spring.application.name=lion-warrior-api

# Conexion MySQL Aiven
spring.datasource.url=jdbc:mysql://lion-warrior-mysql-lionwarrior-db.i.aivencloud.com:27391/defaultdb?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&sslMode=REQUIRED

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Puerto
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}