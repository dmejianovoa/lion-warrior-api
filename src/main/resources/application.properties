spring.application.name=lion-warrior-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lion_warriordb}\
  ?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&sslMode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Puerto del servidor
server.port=${PORT:8080}

# Propiedad con valores por defecto
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}


# El esquema lo define el script SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false